/* ==================================================
   施設・ランドマーク：画像のみ表示するテスト
   削除すれば元の文字表示へ戻る
================================================== */

/* 市場は1段に5種類 */
.market {
  grid-template-columns: repeat(5, minmax(0, 1fr));
}

/* 施設カード本体 */
.card {
  position: relative;
  min-height: 0;
  aspect-ratio: 63 / 88;
  padding: 0;
  overflow: hidden;
  background:
    repeating-linear-gradient(
      45deg,
      #e4e8e6,
      #e4e8e6 10px,
      #d8ddda 10px,
      #d8ddda 20px
    );
}

/* 施設カード画像を全面表示 */
.card-image {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  object-fit: contain;
  background: transparent;
  border-radius: 11px;
}

/* カード内の文字を非表示 */
.card-name,
.card-meta,
.card-text,
.card-foot .set-tag {
  display: none;
}

/* 建設ボタンをカード全面の透明ボタンにする */
.card-foot {
  position: absolute;
  inset: 0;
  display: block;
  margin: 0;
  pointer-events: none;
}

.card-foot .build-btn {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border-radius: 0;
  opacity: 0;
  pointer-events: auto;
}

/* 建設可能なカード */
.card:has(.build-btn:not(:disabled)) {
  cursor: pointer;
}

.card:has(.build-btn:not(:disabled)):hover {
  outline: 4px solid var(--gold);
  outline-offset: -4px;
}

/* コイン不足などで建設不可 */
.card:has(.build-btn:disabled) {
  filter: brightness(0.7);
}

/* 市場の残り枚数は画像上へ残す */
.card .count {
  z-index: 3;
  pointer-events: none;
}


/* ランドマークは横6枚 */
.landmarks {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

/* ランドマーク本体 */
.landmark {
  position: relative;
  aspect-ratio: 63 / 88;
  padding: 0;
  overflow: hidden;
  background:
    repeating-linear-gradient(
      45deg,
      #e4e8e6,
      #e4e8e6 10px,
      #d8ddda 10px,
      #d8ddda 20px
    );
}

/* ランドマーク画像を全面表示 */
.landmark-image {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  object-fit: contain;
  border-radius: 10px;
}

/* ランドマークの文字を非表示 */
.landmark h3,
.landmark p,
.landmark .cost,
.landmark .grow {
  display: none;
}

/* 完成ボタンをカード全面の透明ボタンにする */
.landmark .row {
  position: absolute;
  inset: 0;
  display: block;
  margin: 0;
  pointer-events: none;
}

.landmark .row .btn {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border-radius: 0;
  opacity: 0;
  pointer-events: auto;
}

/* 完成可能なランドマーク */
.landmark:has(.row .btn:not(:disabled)) {
  cursor: pointer;
}

.landmark:has(.row .btn:not(:disabled)):hover {
  outline: 4px solid var(--gold);
  outline-offset: -4px;
}

/* コイン不足 */
.landmark:has(.row .btn:disabled) {
  filter: brightness(0.7);
}

/* 完成済みランドマーク */
.landmark.done {
  background: #fff1bd;
  box-shadow: inset 0 0 0 5px var(--gold);
}

.landmark.done::after {
  content: "✓";
  position: absolute;
  top: 7px;
  right: 7px;
  z-index: 3;
  display: grid;
  place-items: center;
  width: 31px;
  height: 31px;
  border-radius: 50%;
  background: var(--gold);
  color: white;
  font-size: 21px;
  font-weight: 900;
}


/* スマートフォンでは2列 */
@media (max-width: 640px) {
  .market,
  .landmarks {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

/* 施設カードの文字を完全に消す */
.card .card-name,
.card .card-meta,
.card .card-text,
.card .set-tag {
  display: none !important;
}

/* ランドマークの文字を完全に消す */
.landmark h3,
.landmark p,
.landmark .cost,
.landmark .grow {
  display: none !important;
}

/* ==================================================
   施設効果：プレイヤー欄の上へ約1秒表示
================================================== */
.player-effect{
  position:absolute;
  z-index:15;
  left:50%;
  top:-8px;
  transform:translate(-50%,-100%);
  min-width:max-content;
  max-width:calc(100% + 30px);
  padding:7px 11px;
  border:3px solid currentColor;
  border-radius:10px;
  background:#fff;
  box-shadow:0 6px 18px rgba(20,32,38,.24);
  font-size:15px;
  font-weight:900;
  line-height:1.15;
  text-align:center;
  pointer-events:none;
  animation:playerEffectPop 2s ease both;
}
.player-effect.effect-blue{color:var(--blue)}
.player-effect.effect-green{color:var(--green)}
.player-effect.effect-red{color:var(--red)}
.player-effect.effect-purple{color:var(--purple)}
.player-effect.effect-gold{color:var(--gold)}
.player-effect.effect-neutral{color:#52646e}
.player-effect.effect-loss{background:#fff7f6}
.player-effect.effect-gain{background:#f8fffa}
@keyframes playerEffectPop{
  0%{opacity:0;transform:translate(-50%,-82%) scale(.88)}
  8%,88%{opacity:1;transform:translate(-50%,-100%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-116%) scale(.96)}
}
@media(max-width:640px){
  .player-effect{font-size:12px;padding:6px 8px;top:-5px}
}

/* ==================================================
   v0.6：ダイスロール演出・2秒処理
================================================== */
.dice-stage{min-height:92px;display:grid;align-items:center;margin:5px 0 8px}
.settled-dice{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.die{
  display:inline-grid;
  place-items:center;
  width:58px;
  height:58px;
  border:2px solid #cbd2d0;
  border-radius:13px;
  background:#fff;
  color:#17242b;
  box-shadow:0 5px 12px rgba(23,36,43,.18);
  font-size:47px;
  line-height:1;
}
.settled-dice small{font-size:18px;font-weight:900;color:#8a610e}
.dice-roll-animation{
  display:grid;
  justify-items:center;
  gap:7px;
  padding:10px 14px;
  border:2px solid #e1c36c;
  border-radius:14px;
  background:linear-gradient(135deg,#fff7cf,#fff);
  overflow:hidden;
}
.dice-roll-label{font-size:13px;font-weight:900;color:#725513}
.rolling-dice{display:flex;gap:12px;justify-content:center}
.die.rolling{animation:diceTumble .34s linear infinite}
.die.settled{animation:diceSettle .32s ease-out both;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,155,44,.18),0 6px 14px rgba(23,36,43,.18)}
.dice-roll-total{font-size:14px;font-weight:800;color:var(--muted)}
.dice-roll-total strong{display:inline-block;margin-left:5px;color:#9b6a0c;font-size:27px;animation:resultPop .32s ease-out both}
@keyframes diceTumble{
  0%{transform:translate(-3px,-2px) rotate(-8deg) scale(.96)}
  25%{transform:translate(4px,1px) rotate(7deg) scale(1.04)}
  50%{transform:translate(-1px,3px) rotate(-4deg) scale(.98)}

  <script>
'use strict';

const app=document.getElementById('app');
const toastBox=document.getElementById('toast');
let meta=null,imageMap={},game=null,roomState=null,rooms=[],ws=null,busy=false;
let currentRoomId=null,currentName='',intentionalClose=false,reconnectTimer=null,roomTimer=null,pingTimer=null;

let logFollowLatest=true,logScrollTop=0,logScrollHeight=0;
let visualInitialized=false,lastVisualLogSeq=0;
let visualQueue=[],activeVisual=null,visualTimer=null,diceInterval=null,diceSettleTimer=null,visualCoins=null;
const VISUAL_DISPLAY_MS=2000;
const VISUAL_GAP_MS=160;
const DICE_ROLLING_MS=1300;

const diceFaces=['','⚀','⚁','⚂','⚃','⚄','⚅'];
const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const byId=(list,id)=>list.find(item=>item.id===id);
const itemName=id=>byId(meta?.cards||[],id)?.name||byId(meta?.landmarks||[],id)?.name||id;

function showToast(text){toastBox.innerHTML=`<div class="toast">${esc(text)}</div>`;setTimeout(()=>toastBox.innerHTML='',2850)}
function captureLogPosition(){
  const el=document.getElementById('logs');
  if(!el)return;
  logFollowLatest=el.scrollTop<=12;
  logScrollTop=el.scrollTop;
  logScrollHeight=el.scrollHeight;
}
function restoreLogPosition(){
  const el=document.getElementById('logs');
  if(!el)return;
  if(logFollowLatest)el.scrollTop=0;
  else el.scrollTop=logScrollTop+Math.max(0,el.scrollHeight-logScrollHeight);
  el.addEventListener('scroll',()=>{
    logFollowLatest=el.scrollTop<=12;
    logScrollTop=el.scrollTop;
    logScrollHeight=el.scrollHeight;
  },{passive:true});
}
function resetEffectAnimations(){
  if(visualTimer)clearTimeout(visualTimer);
  if(diceInterval)clearInterval(diceInterval);
  if(diceSettleTimer)clearTimeout(diceSettleTimer);
  visualTimer=null;diceInterval=null;diceSettleTimer=null;visualQueue=[];activeVisual=null;visualCoins=null;
  visualInitialized=false;lastVisualLogSeq=0;
}
function effectType(reason){
  const card=(meta?.cards||[]).find(c=>reason===c.name||reason.includes(c.name));
  if(card)return card.type;
  const landmark=(meta?.landmarks||[]).find(l=>reason===l.name||reason.includes(l.name));
  return landmark?'gold':'neutral';
}
function mergeChanges(logs){
  const merged=new Map();
  for(const log of logs){
    for(const change of log.changes||[]){
      const prev=merged.get(change.playerId)||{playerId:change.playerId,playerName:change.playerName,delta:0};
      prev.delta+=change.delta;merged.set(change.playerId,prev);
    }
  }
  return [...merged.values()].filter(c=>c.delta!==0);
}
function setupVisualCoins(g,fresh){
  if(visualCoins||activeVisual||visualQueue.length)return;
  const coinLogs=fresh.filter(log=>log.kind==='coin');
  if(!coinLogs.length)return;
  visualCoins=new Map(g.players.map(player=>[player.id,player.coins]));
  for(const log of coinLogs){
    for(const change of log.changes||[]){
      visualCoins.set(change.playerId,(visualCoins.get(change.playerId)||0)-change.delta);
    }
  }
}
function queueNewVisuals(g){
  const all=(g.logs||[]).filter(log=>(log.kind==='coin'||log.kind==='dice')&&Number.isFinite(log.seq));
  const maxSeq=all.reduce((n,log)=>Math.max(n,log.seq),0);
  if(!visualInitialized){lastVisualLogSeq=maxSeq;visualInitialized=true;return}
  const fresh=all.filter(log=>log.seq>lastVisualLogSeq).sort((a,b)=>a.seq-b.seq);
  if(!fresh.length)return;
  lastVisualLogSeq=Math.max(lastVisualLogSeq,...fresh.map(log=>log.seq));
  setupVisualCoins(g,fresh);
  for(let i=0;i<fresh.length;i++){
    const first=fresh[i];
    if(first.kind==='dice'){
      visualQueue.push({
        kind:'dice',
        label:first.label||'ダイスロール',
        playerName:first.playerName||'',
        dice:[...(first.dice||[])],
        sum:first.sum,
      });
      continue;
    }
    const grouped=[first];
    if(first.detail==='銀行から'){
      while(i+1<fresh.length&&fresh[i+1].kind==='coin'&&fresh[i+1].reason===first.reason&&fresh[i+1].detail==='銀行から')grouped.push(fresh[++i]);
    }
    visualQueue.push({kind:'coin',reason:first.reason,type:effectType(first.reason),changes:mergeChanges(grouped)});
  }
}
function effectAnimationsBusy(){return Boolean(activeVisual||visualQueue.length||visualTimer||diceInterval||diceSettleTimer)}
function displayedCoins(player){return visualCoins?.has(player.id)?visualCoins.get(player.id):player.coins}
function updateDisplayedCoins(){
  document.querySelectorAll('[data-player-coins]').forEach(el=>{
    const id=el.dataset.playerCoins;
    const player=game?.players?.find(p=>p.id===id);
    if(player)el.textContent=String(visualCoins?.has(id)?visualCoins.get(id):player.coins);
  });
}
function applyVisualChanges(changes){
  if(!visualCoins)visualCoins=new Map((game?.players||[]).map(player=>[player.id,player.coins]));
  for(const change of changes||[]){
    visualCoins.set(change.playerId,(visualCoins.get(change.playerId)||0)+change.delta);
  }
  updateDisplayedCoins();
}
function renderActiveEffect(){
  document.querySelectorAll('.player-effect').forEach(el=>el.remove());
  if(!activeVisual||activeVisual.kind!=='coin')return;
  for(const change of activeVisual.changes){
    const panel=[...document.querySelectorAll('.player[data-player-id]')].find(el=>el.dataset.playerId===String(change.playerId));
    if(!panel)continue;
    const bubble=document.createElement('div');
    bubble.className=`player-effect effect-${activeVisual.type} ${change.delta>0?'effect-gain':'effect-loss'}`;
    bubble.textContent=`${activeVisual.reason}${change.delta>0?'+':''}${change.delta}`;
    panel.appendChild(bubble);
  }
}
function renderDiceAnimation(event){
  const stage=document.getElementById('diceStage');
  if(!stage)return;
  const count=Math.max(1,event.dice.length||1);
  stage.innerHTML=`<div class="dice-roll-animation"><div class="dice-roll-label">${esc(event.playerName?`${event.playerName}：${event.label}`:event.label)}</div><div class="rolling-dice">${Array.from({length:count},()=>'<span class="die rolling">⚀</span>').join('')}</div><div class="dice-roll-total">ロール中…</div></div>`;
  const diceEls=[...stage.querySelectorAll('.die')];
  diceInterval=setInterval(()=>{
    diceEls.forEach(el=>{el.textContent=diceFaces[1+Math.floor(Math.random()*6)]});
  },85);
  diceSettleTimer=setTimeout(()=>{
    clearInterval(diceInterval);diceInterval=null;diceSettleTimer=null;
    diceEls.forEach((el,i)=>{el.textContent=diceFaces[event.dice[i]||1];el.classList.remove('rolling');el.classList.add('settled')});
    const total=stage.querySelector('.dice-roll-total');
    if(total)total.innerHTML=`確定 <strong>${event.sum}</strong>`;
  },DICE_ROLLING_MS);
}
function finishActiveVisual(){
  if(diceInterval){clearInterval(diceInterval);diceInterval=null}
  if(diceSettleTimer){clearTimeout(diceSettleTimer);diceSettleTimer=null}
  document.querySelectorAll('.player-effect').forEach(el=>el.remove());
  activeVisual=null;
  visualTimer=setTimeout(()=>{
    visualTimer=null;
    if(visualQueue.length)startNextEffect();
    else{
      visualCoins=null;
      if(game)render();
    }
  },VISUAL_GAP_MS);
}
function startNextEffect(){
  if(activeVisual||!visualQueue.length)return;
  activeVisual=visualQueue.shift();
  if(activeVisual.kind==='dice')renderDiceAnimation(activeVisual);
  else{
    applyVisualChanges(activeVisual.changes);
    renderActiveEffect();
  }
  const remaining=Math.max(0,VISUAL_DISPLAY_MS-(activeVisual.kind==='dice'?DICE_ROLLING_MS:0));
  if(activeVisual.kind==='dice'){
    visualTimer=setTimeout(finishActiveVisual,VISUAL_DISPLAY_MS);
  }else{
    visualTimer=setTimeout(finishActiveVisual,remaining||VISUAL_DISPLAY_MS);
  }
}

function bindCommon(){document.querySelector('[data-cmd="ids"]')?.addEventListener('click',showIds);document.querySelector('[data-cmd="results"]')?.addEventListener('click',showResults);document.querySelector('[data-cmd="reset"]')?.addEventListener('click',resetGame);document.querySelector('[data-cmd="rooms"]')?.addEventListener('click',leaveToRooms)}
function resetGame(){if(!roomState?.isHost)return;if(!confirm('現在のゲームを終了し、同じ参加者でロビーへ戻しますか？'))return;sendWs({type:'reset_room'})}
async function init(){currentName=localStorage.getItem('machikoro-online-name')||'SABA';const savedRoom=localStorage.getItem('machikoro-online-room');if(savedRoom&&ROOM_IDS.includes(savedRoom)&&workerConfigured())connectRoom(savedRoom,currentName,true);else loadRooms()}
function activeLandmarks(g){return meta.landmarks.filter(l=>g.activeLandmarkIds?.includes(l.id))}
function playerPanel(p,index,g){
  const active=activeLandmarks(g),done=active.filter(l=>p.landmarks[l.id]).length;
  return `<div class="player ${p.isCurrent?'current':''} ${p.id===g.viewerId?'me':''}" data-player-id="${esc(p.id)}"><div class="player-head"><span>${index+1}. ${esc(p.name)} ${p.isCpu?'🤖':p.connected===false?'（切断中）':''}</span><span class="coins"><span data-player-coins="${esc(p.id)}">${displayedCoins(p)}</span>🪙 ${latestPlayerDelta(p.id,g)}</span></div><div class="mini">施設 ${Object.values(p.city).reduce((a,b)=>a+b,0)}軒 / ランドマーク ${done}/${active.length}</div><div class="landmark-dots">${active.map(l=>`<span class="landmark-dot ${p.landmarks[l.id]?'done':''}" title="${esc(l.name)}"></span>`).join('')}</div><button class="btn outline" data-view-city="${p.id}">街を見る</button></div>`;
}
function latestPlayerDelta(playerId,g){
  if(effectAnimationsBusy()||visualCoins)return'';
  for(let i=g.logs.length-1;i>=0;i--){const log=g.logs[i];if(Date.now()-log.at>5000)return'';if(log.kind!=='coin'||!Array.isArray(log.changes))continue;const delta=log.changes.filter(c=>c.playerId===playerId).reduce((n,c)=>n+c.delta,0);if(delta)return`<span class="recent-delta ${delta>0?'gain':'loss'}">${delta>0?'+':''}${delta}</span>`}
  return'';
}

function renderBanPick(){
  const g=game,current=g.players.find(p=>p.id===g.currentPlayerId),mine=current?.id===g.viewerId&&!current.isCpu;
  const cardChoices=(g.banPick?.choices||[]).filter(c=>c.kind==='card');
  const lmChoices=(g.banPick?.choices||[]).filter(c=>c.kind==='landmark');
  const completed=g.banPick?.completed||[];
  const choiceHtml=item=>`<button class="ban-option type-${esc(item.type||'landmark')}" type="button" data-ban-item="${esc(item.id)}">${imageMap[item.id]?`<img src="${esc(imageMap[item.id])}" alt="${esc(item.name)}">`:''}<span><b>${esc(item.name)}</b><small>${item.kind==='landmark'?`ランドマーク / ${item.cost}コイン`:`${item.supply==='low'?'1～6':'7～12'} / 出目 ${item.rolls.join('・')} / ${item.cost}コイン`}</small></span></button>`;
  app.innerHTML=`<div class="shell">${topbar()}<main class="page"><section class="panel lobby ban-lobby"><h1>各プレイヤーBANピック</h1><p><b>${esc(current?.name)}</b>の選択です。選ばれたカードは、このゲームの山札・ランドマークから除外されます。</p>
    <div class="players">${g.players.map((p,i)=>playerPanel(p,i,g)).join('')}</div>
    <div class="ban-progress">${g.players.map(p=>{const pick=completed.find(x=>x.playerId===p.id);return`<div class="ban-progress-item ${pick?'done':''}"><b>${esc(p.name)}</b><span>${pick?(pick.itemId?`BAN：${esc(itemName(pick.itemId))}`:'BANなし'):'選択待ち'}</span></div>`}).join('')}</div>
    ${mine?`<div class="ban-picker"><div class="section-title"><h2>施設をBAN</h2><span class="hint">1枚だけ選択</span></div><div class="ban-option-grid">${cardChoices.map(choiceHtml).join('')}</div><div class="section-title"><h2>ランドマークをBAN</h2></div><div class="ban-option-grid">${lmChoices.map(choiceHtml).join('')}</div><button class="btn outline big" type="button" data-ban-skip>BANしない</button></div>`:`<div class="decision"><h3>${current?.isCpu?'CPUが選択中':'選択待ち'}</h3><p>${esc(current?.name||'プレイヤー')}がBANを選んでいます。</p></div>`}
  </section></main></div>`;
  bindCommon();
  document.querySelectorAll('[data-ban-item]').forEach(button=>button.onclick=()=>act('ban_pick',{itemId:button.dataset.banItem}));
  document.querySelector('[data-ban-skip]')?.addEventListener('click',()=>act('ban_pick',{skip:true}));
  document.querySelectorAll('[data-view-city]').forEach(b=>b.onclick=()=>showCity(b.dataset.viewCity));
}

function cardImage(id){const src=imageMap[id];return src?`<img class="card-image" src="${esc(src)}" alt="${esc(byId(meta.cards,id)?.name||id)}" onerror="this.remove()">`:''}
function cardHtml(card,count=1,opts={}){
  const canBuild=Boolean(opts.canBuild),closed=opts.closed||0;
  return `<article class="card ${card.type} ${closed>=count?'closed':''}" title="ID: ${esc(card.id)}">${cardImage(card.id)}<span class="count">×${count}${closed?` / 休${closed}`:''}</span><div class="card-name">${esc(card.name)}</div><div class="card-meta"><span>🎲 ${card.rolls.join('・')}</span><span>🪙 ${card.cost}</span></div><div class="card-text">${esc(card.text)}</div><div class="card-foot"><span class="set-tag">${esc(meta.setLabels[card.set]||card.set)} / ${card.supply==='low'?'1～6':'7～12'}</span>${canBuild?`<button class="btn primary build-btn" data-build-card="${card.id}" ${opts.disabled?'disabled':''}>建設</button>`:''}</div></article>`;
}
function logHtml(log){
  if(log.kind==='coin'&&Array.isArray(log.changes)){
    const flows=log.changes.map(c=>`<span class="coin-change ${c.delta>0?'gain':'loss'}"><b>${esc(c.playerName)}</b> ${c.delta>0?'+':''}${c.delta}コイン</span>`).join('<span class="coin-arrow">→</span>');
    return `<div class="log coin-log"><div class="log-reason">${esc(log.reason)}</div><div class="coin-flow">${flows}</div>${log.detail?`<div class="log-detail">${esc(log.detail)}</div>`:''}</div>`;
  }
  return `<div class="log">${esc(log.text)}</div>`;
}
function decisionHtml(g){
  const q=g.pending;if(!q)return'';
  if(effectAnimationsBusy())return`<div class="decision effect-wait"><h3>演出を表示中</h3><p>ダイスとコイン処理を順番に確認しています。</p></div>`;
  const mine=q.playerId===g.viewerId;
  if(!mine){const chooser=g.players.find(p=>p.id===q.playerId);return`<div class="decision"><h3>${chooser?.isCpu?'CPUの選択中':'選択待ち'}</h3><p>${esc(chooser?.name||'プレイヤー')}：${esc(q.prompt||'処理を選択しています')}</p></div>`;}
  if(q.kind==='reroll')return`<div class="decision"><h3>電波塔</h3><p>出目 ${q.dice.map(d=>diceFaces[d]).join('')}（${q.sum}）を振り直しますか？</p><div class="actions"><button class="btn primary" data-action="reroll" data-yes="true">振り直す</button><button class="btn" data-action="reroll" data-yes="false">そのまま</button></div></div>`;
  if(q.kind==='harbor')return`<div class="decision"><h3>港</h3><p>出目 ${q.sum} を ${q.sum+2} にしますか？</p><div class="actions"><button class="btn primary" data-action="harbor" data-yes="true">＋2する</button><button class="btn" data-action="harbor" data-yes="false">使わない</button></div></div>`;
  if(q.kind==='invest')return`<div class="decision"><h3>ITベンチャー</h3><p>1コイン投資しますか？</p><div class="actions"><button class="btn primary" data-action="invest" data-yes="true">投資する</button><button class="btn" data-action="invest" data-yes="false">しない</button></div></div>`;
  return `<div class="decision"><h3>${esc(q.prompt||'選択')}</h3><div class="choice-grid">${(q.choices||[]).map(c=>`<button class="btn primary" data-choice="${esc(c.id)}">${esc(c.label)}</button>`).join('')}${q.optional?'<button class="btn" data-skip-choice>何もしない</button>':''}</div></div>`;
}
function turnHtml(g,me){
  const current=g.players.find(p=>p.id===g.currentPlayerId),mine=current?.id===g.viewerId&&!current.isCpu&&!effectAnimationsBusy(),last=g.lastRoll;
  const settled=last?`<div class="dice settled-dice">${last.dice.map(d=>`<span class="die">${diceFaces[d]}</span>`).join('')} <small>合計 ${last.finalSum}</small></div>`:'<div class="hint">ダイス待ち</div>';
  return `<div class="turn-box"><h2>${esc(current?.name)}のターン ${current?.isCpu?'🤖':''}</h2><div class="dice-stage" id="diceStage">${settled}</div>${decisionHtml(g)}${mine&&!g.pending&&g.phase==='roll'?`<div class="actions"><button class="btn primary big" data-roll="1">🎲 1個振る</button>${me.landmarks.train_station?'<button class="btn gold big" data-roll="2">🎲🎲 2個振る</button>':''}</div>`:''}${mine&&!g.pending&&g.phase==='build'?'<div class="actions"><button class="btn outline" data-pass>何も建設せず終了</button></div>':''}</div>`;
}
function renderGame(){
  captureLogPosition();const g=game;queueNewVisuals(g);
  const me=g.players.find(p=>p.id===g.viewerId),mine=g.currentPlayerId===g.viewerId&&!me?.isCpu&&!effectAnimationsBusy();
  if(!me){return renderLobby()}
  const market=Object.entries(g.market).map(([id,count])=>({card:byId(meta.cards,id),count})).filter(x=>x.card).sort((a,b)=>Math.min(...a.card.rolls)-Math.min(...b.card.rolls)||a.card.cost-b.card.cost);
  const lowMarket=market.filter(x=>x.card.supply==='low'),highMarket=market.filter(x=>x.card.supply==='high');
  const marketCards=items=>items.map(x=>cardHtml(x.card,x.count,{canBuild:mine&&!g.pending&&g.phase==='build',disabled:me.coins<x.card.cost||(x.card.type==='purple'&&me.city[x.card.id])})).join('');
  const ownCards=Object.entries(me.city).map(([id,count])=>({card:byId(meta.cards,id),count,closed:me.closed[id]||0})).filter(x=>x.card);
  const landmarks=activeLandmarks(g);
  const banText=(g.bans?.all||[]).length?`${g.bans.all.length}枚BAN中`:'BANなし';
  app.innerHTML=`<div class="shell">${topbar()}<main class="page game-layout"><div class="board">
    ${g.winnerId?`<section class="panel section"><div class="turn-box"><h1>🏆 ${esc(g.players.find(p=>p.id===g.winnerId)?.name)}の勝利</h1><p>有効なランドマーク${landmarks.length}種類をすべて完成させました。</p><button class="btn gold big" data-open-results>リザルトを見る</button></div></section>`:''}
    <section class="panel section"><div class="section-title"><h2>プレイヤー</h2><span class="hint">第${g.turnNo}手番 / ${esc(banText)}</span></div><div class="players">${g.players.map((p,i)=>playerPanel(p,i,g)).join('')}</div></section>
    <section class="panel section">${turnHtml(g,me)}</section>
    <section class="panel section"><div class="section-title"><h2>市場</h2><span class="hint">1～6を5種類＋7～12を5種類</span></div><div class="market-group"><div class="market-label"><b>🎲 1～6の施設</b><span>山札 ${g.deckRemaining.low}枚</span></div><div class="market">${marketCards(lowMarket)}</div></div><div class="market-group"><div class="market-label"><b>🎲 7～12の施設</b><span>山札 ${g.deckRemaining.high}枚</span></div><div class="market">${marketCards(highMarket)}</div></div></section>
    <section class="panel section"><div class="section-title"><h2>ランドマーク</h2><span class="hint">有効な${landmarks.length}種類を完成で勝利</span></div><div class="landmarks">${landmarks.map(l=>`<div class="landmark ${me.landmarks[l.id]?'done':''}">${imageMap[l.id]?`<img class="landmark-image" src="${esc(imageMap[l.id])}" alt="${esc(l.name)}" onerror="this.remove()">`:''}<h3>${me.landmarks[l.id]?'✅':'🏗️'} ${esc(l.name)}</h3><p>${esc(l.text)}</p><div class="row"><span class="cost">${l.cost}コイン</span><span class="grow"></span>${!me.landmarks[l.id]&&mine&&!g.pending&&g.phase==='build'?`<button class="btn gold" data-build-landmark="${l.id}" ${me.coins<l.cost?'disabled':''}>完成</button>`:''}</div></div>`).join('')}</div></section>
  </div><aside class="sidebar"><section class="panel section"><div class="section-title"><h2>自分の街</h2><span><span data-player-coins="${esc(me.id)}">${displayedCoins(me)}</span>🪙</span></div><div class="city-list">${ownCards.map(x=>`<span class="city-chip ${x.closed?'closed':''}" title="${esc(x.card.text)}">${esc(x.card.name)} ×${x.count}${x.closed?`（休${x.closed}）`:''}</span>`).join('')}</div></section><section class="panel section"><div class="section-title"><h2>ゲームログ</h2></div><div class="logs" id="logs">${g.logs.slice().reverse().map(logHtml).join('')}</div></section></aside></main></div>`;
  bindCommon();bindGame();restoreLogPosition();if(activeVisual?.kind==='coin')renderActiveEffect();else if(activeVisual?.kind==='dice')renderDiceAnimation(activeVisual);else startNextEffect();document.querySelector('[data-open-results]')?.addEventListener('click',showResults);
}
function bindGame(){
  document.querySelectorAll('[data-roll]').forEach(b=>b.onclick=()=>act('roll',{diceCount:Number(b.dataset.roll)}));
  document.querySelectorAll('[data-build-card]').forEach(b=>b.onclick=()=>act('build_card',{cardId:b.dataset.buildCard}));
  document.querySelectorAll('[data-build-landmark]').forEach(b=>b.onclick=()=>act('build_landmark',{landmarkId:b.dataset.buildLandmark}));
  document.querySelector('[data-pass]')?.addEventListener('click',()=>act('pass'));
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action,{yes:b.dataset.yes==='true'}));
  document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>act('choice',{value:b.dataset.choice}));
  document.querySelector('[data-skip-choice]')?.addEventListener('click',()=>act('choice',{skip:true}));
  document.querySelectorAll('[data-view-city]').forEach(b=>b.onclick=()=>showCity(b.dataset.viewCity));
}
function act(type,payload={}){if(busy)return;busy=true;sendWs({type:'game_action',payload:{action:type,payload}});setTimeout(()=>busy=false,260)}

function distributionRows(values,start,end){
  const max=Math.max(1,...Array.from({length:end-start+1},(_,i)=>Number(values?.[i+start]||0)));
  return Array.from({length:end-start+1},(_,i)=>{const n=i+start,count=Number(values?.[n]||0),width=count/max*100;return`<div class="result-bar-row"><b>${n}</b><div class="result-bar-track"><span style="width:${width}%"></span></div><strong>${count}回</strong></div>`}).join('');
}
function resultIncomeRows(map,kind='card'){
  const entries=Object.entries(map||{}).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length)return'<p class="hint">該当なし</p>';
  return `<div class="result-income-list">${entries.map(([id,amount])=>`<div><span>${esc(kind==='landmark'?byId(meta.landmarks,id)?.name||id:byId(meta.cards,id)?.name||id)}</span><b>+${amount}コイン</b></div>`).join('')}</div>`;
}
function showResults(){
  if(!game?.stats)return;
  const stats=game.stats,dice=stats.dice.turn,extra=stats.dice.extra;
  const bans=[...(game.bans?.initial||[]).map(id=>`初期：${itemName(id)}`),...(game.bans?.player||[]).map(p=>`${p.playerName}：${p.itemId?itemName(p.itemId):'BANなし'}`)];
  const playerSections=game.players.map(player=>{const s=stats.players[player.id]||{};return`<section class="result-player"><div class="section-title"><h3>${esc(player.name)} ${player.id===game.winnerId?'🏆':''}</h3><span>${player.coins}コインで終了</span></div><div class="result-metrics"><div><small>総収入</small><b>+${s.totalIncome||0}</b></div><div><small>総支出</small><b>-${s.totalExpense||0}</b></div><div><small>施設建設費</small><b>${s.buildSpent||0}</b></div><div><small>ランドマーク建設費</small><b>${s.landmarkSpent||0}</b></div></div><h4>施設が稼いだコイン</h4>${resultIncomeRows(s.facilityIncome,'card')}<h4>ランドマークが稼いだコイン</h4>${resultIncomeRows(s.landmarkIncome,'landmark')}</section>`}).join('');
  const div=document.createElement('div');div.className='modal-backdrop';
  div.innerHTML=`<div class="modal result-modal"><div class="row"><h2 class="grow">${game.winnerId?'ゲームリザルト':'途中集計'}</h2><button class="btn" data-close>閉じる</button></div><div class="result-metrics top"><div><small>手番数</small><b>${game.turnNo}</b></div><div><small>通常ロール</small><b>${dice.rolls}</b></div><div><small>1個振り</small><b>${dice.oneDie}</b></div><div><small>2個振り</small><b>${dice.twoDice}</b></div><div><small>振り直し</small><b>${dice.rerolls}</b></div></div><section class="result-section"><h3>実際に振った通常ダイスの合計</h3>${distributionRows(dice.totals,1,12)}</section><section class="result-section"><h3>効果処理に使われた最終出目</h3><p class="hint">振り直し後・港の＋2適用後の出目です。</p>${distributionRows(stats.dice.resolvedTotals,1,14)}</section><section class="result-section"><h3>サイコロ各面の出現数</h3>${distributionRows(dice.faces,1,6)}</section>${extra.rolls?`<section class="result-section"><h3>追加ダイス（マグロ漁船）</h3><p>${extra.rolls}回</p>${distributionRows(extra.totals,2,12)}</section>`:''}<section class="result-section"><h3>BAN結果</h3><div class="ban-result-list">${bans.length?bans.map(x=>`<span>${esc(x)}</span>`).join(''):'<span>BANなし</span>'}</div></section><section class="result-section"><h3>プレイヤー別収支</h3><div class="result-player-grid">${playerSections}</div></section></div>`;
  document.body.appendChild(div);const close=()=>div.remove();div.querySelector('[data-close]').onclick=close;div.onclick=e=>{if(e.target===div)close()};
}

function showCity(playerId){
  const g=game,p=g?.players.find(x=>x.id===playerId);if(!p)return;
  const owned=Object.entries(p.city).map(([id,count])=>({card:byId(meta.cards,id),count,closed:p.closed[id]||0})).filter(x=>x.card);
  const landmarks=activeLandmarks(g);
  const div=document.createElement('div');div.className='modal-backdrop';
  div.innerHTML=`<div class="modal"><div class="row"><h2 class="grow">${esc(p.name)}の街・${p.coins}コイン</h2><button class="btn" data-close>閉じる</button></div><h3>施設</h3><div class="city-view-grid">${owned.map(x=>cardHtml(x.card,x.count,{closed:x.closed})).join('')}</div><h3>ランドマーク</h3><div class="landmarks">${landmarks.map(l=>`<div class="landmark ${p.landmarks[l.id]?'done':''}">${imageMap[l.id]?`<img class="landmark-image" src="${esc(imageMap[l.id])}" alt="${esc(l.name)}" onerror="this.remove()">`:''}<h3>${p.landmarks[l.id]?'✅':'🏗️'} ${esc(l.name)}</h3><p>${esc(l.text)}</p></div>`).join('')}</div></div>`;
  document.body.appendChild(div);const close=()=>div.remove();div.querySelector('[data-close]').onclick=close;div.onclick=e=>{if(e.target===div)close()};
}
function showIds(){
  const div=document.createElement('div');div.className='modal-backdrop';
  div.innerHTML=`<div class="modal"><div class="row"><h2 class="grow">カード画像の割り当てID</h2><button class="btn" data-close>閉じる</button></div><p>画像はGitHub側の <code>assets/cards</code> に、指定済みのJPEGファイル名で置きます。</p><div class="id-table">${meta.cards.map(c=>`<div class="id-row"><b>${esc(c.name)}</b><br><code>${esc(c.id)}</code></div>`).join('')}${meta.landmarks.map(c=>`<div class="id-row"><b>${esc(c.name)}（ランドマーク）</b><br><code>${esc(c.id)}</code></div>`).join('')}</div></div>`;
  document.body.appendChild(div);const close=()=>div.remove();div.querySelector('[data-close]').onclick=close;div.onclick=e=>{if(e.target===div)close()};
}


init();

  </script>
</body>
</html>
